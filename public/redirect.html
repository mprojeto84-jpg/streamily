<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecionando... - Streamily TV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 4px solid #1a1a1a;
      border-top-color: #00c853;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      text-align: center;
      padding: 0 20px;
    }
    .text h2 {
      margin-bottom: 10px;
      color: #00c853;
    }
    .text p {
      color: #888;
      font-size: 14px;
    }
    .timer {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #00c853;
    }
    .progress-bar {
      width: 200px;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      margin-top: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #00c853;
      width: 0%;
      animation: progress 10s linear forwards;
    }
    @keyframes progress {
      to { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="text">
    <h2>Redirecionando...</h2>
    <p>Aguarde enquanto preparamos seu acesso</p>
    <div class="timer" id="timer">10</div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
  </div>

  <script>
    // Pega o URL de destino dos parâmetros
    const urlParams = new URLSearchParams(window.location.search);
    const targetUrl = atob(urlParams.get('url') || '');
    
    let seconds = 10;
    const timerEl = document.getElementById('timer');
    
    const countdown = setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;
      
      if (seconds <= 0) {
        clearInterval(countdown);
        if (targetUrl) {
          window.location.href = targetUrl;
        } else {
          window.close();
        }
      }
    }, 1000);
    
    // Previne volta rápida
    history.pushState(null, null, location.href);
    window.onpopstate = function() {
      history.pushState(null, null, location.href);
    };
  </script>
</body>
</html>
